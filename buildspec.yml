version: 0.2

# SITE_BUCKET, DISTRIBUTION_ID, FUNCTION_NAME and VITE_API_URL are injected
# by the CodeBuild project defined in template.yml.

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      # Use `npm ci` instead once a package-lock.json is committed
      - npm install
  build:
    # Deploy steps live in `build` (not `post_build`) so a failed build
    # never reaches S3.
    commands:
      - npm run build

      # Hashed assets: cache for a year
      - aws s3 sync dist/assets "s3://${SITE_BUCKET}/assets" --delete --cache-control "public,max-age=31536000,immutable"
      # Everything else (index.html etc.): always revalidate
      - aws s3 sync dist "s3://${SITE_BUCKET}" --delete --exclude "assets/*" --cache-control "no-cache"

      # Ship the latest Lambda code
      - (cd lambda && zip -j ../lambda.zip index.mjs)
      - aws lambda update-function-code --function-name "${FUNCTION_NAME}" --zip-file fileb://lambda.zip

      # Make CloudFront serve the new files right away
      - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"
