version: 0.2

phases:
  build:
    commands:
      - echo "Packaging SAM / CloudFormation template..."
      - aws cloudformation package --template-file template.yaml --s3-bucket codepipeline-ap-south-1-81ed13876dd9-4a32-b1fd-c2b38744425c --output-template-file packaged-template.yaml --region ap-south-1
      
      - echo "Deploying backend infrastructure via CloudFormation..."
      - aws cloudformation deploy --template-file packaged-template.yaml --stack-name my-serverless-stack --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND --region ap-south-1

      - echo "Deploying frontend to S3..."
      - aws s3 sync frontend/ s3://mywebpage-frontendbucket-3akzjbbo5333

artifacts:
  files:
    - packaged-template.yaml