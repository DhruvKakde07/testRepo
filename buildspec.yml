version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
  build:
    commands:
      - echo "Building serverless application..."
      - echo "Syncing frontend files..."
  post_build:
    commands:
      - echo "Build completed on `date`"
artifacts:
  files:
    - template.yaml
    - frontend/**/*
    - backend/**/*