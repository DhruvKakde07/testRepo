AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Web App with S3 Frontend and Lambda Backend

Resources:
  # 1. S3 Bucket for Frontend Website Hosting
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # 2. Lambda Backend Function + API Gateway Trigger
  MyLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: index.handler
      Runtime: nodejs20.x
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /api
            Method: get

Outputs:
  WebsiteURL:
    Description: "S3 Static Website URL"
    Value: !GetAtt FrontendBucket.WebsiteURL
  ApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api"