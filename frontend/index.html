<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless AWS Pipeline Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-container {
            margin-top: 24px;
            text-align: left;
            display: none;
        }

        .response-container.active {
            display: block;
        }

        .response-header {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        pre {
            background: #090d16;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 8px;
            color: #fca5a5;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        .error {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">CI/CD Automated Deployment</span>
        <h1>Serverless API Dashboard</h1>
        <p>Click the button below to send a live request to your AWS Lambda backend via API Gateway.</p>

        <button id="api-btn" class="btn" onclick="callLambdaApi()">Trigger Lambda Function</button>

        <div id="response-box" class="response-container">
            <div class="response-header">API Response</div>
            <pre id="response-text">Waiting for request...</pre>
        </div>
    </div>

    <script>
        // Replace this URL with your actual API Gateway Endpoint URL
        const API_URL = 'YOUR_API_GATEWAY_ENDPOINT_URL';

        async function callLambdaApi() {
            const btn = document.getElementById('api-btn');
            const responseBox = document.getElementById('response-box');
            const responseText = document.getElementById('response-text');

            // UI Feedback during request
            btn.disabled = true;
            btn.innerText = 'Calling Backend...';
            responseBox.classList.add('active');
            responseText.classList.remove('error');
            responseText.innerText = 'Sending request to Lambda...';

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }
                const data = await response.json();

                responseText.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                responseText.classList.add('error');
                responseText.innerText = `Error: ${error.message}\nCheck CORS policy or API URL.`;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Trigger Lambda Function';
            }
        }
    </script>

</body>
</html>
